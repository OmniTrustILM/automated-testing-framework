services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: [start-dev, '--features=token-exchange-delegation,parameterized-scopes']
    ports: ['127.0.0.1:18818:8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: '${DELEGATION_KEYCLOAK_ADMIN_PASSWORD:?Set a disposable bootstrap password}'
