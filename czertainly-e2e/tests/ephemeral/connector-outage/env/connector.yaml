# What this folder needs beyond the base environment: its own connector, so switching it off disturbs no other test.
# Network Discovery (public image, v1 health paths), on the platform's database like the other connectors.
apiVersion: otilm.com/v1alpha1
kind: Connector
metadata:
  name: example-network-discovery
  namespace: ilm
spec:
  image:
    repository: hub.omnitrustregistry.com/ilm/ip-discovery-provider
    tag: develop-latest
  service:
    port: 8080
  probes:
    liveness: { path: /health/liveness, initialDelaySeconds: 15, periodSeconds: 10, failureThreshold: 3 }
    readiness: { path: /health/readiness, initialDelaySeconds: 5, periodSeconds: 10, failureThreshold: 3 }
    startup: { path: /health/liveness, periodSeconds: 10, failureThreshold: 45 }
  volumes:
    - name: tmp
      mountPath: /tmp
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi
  env:
    - name: PORT
      value: "8080"
    - name: JDBC_URL
      value: jdbc:postgresql://ilm-db-rw.ilm.svc:5432/ilm?characterEncoding=UTF-8
  secretRefs:
    - name: ilm-db-app
      type: env
      keys:
        - secretKey: username
          envVar: JDBC_USERNAME
        - secretKey: password
          envVar: JDBC_PASSWORD
