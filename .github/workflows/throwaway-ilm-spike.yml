name: Spike throw-away ILM (ATF#165)

# Measures, on a standard GitHub runner, time to a running ILM (operator + kind + develop-latest images + connectors,
# with the private time-quality monitor and timestamp formatting connector + own NTP + own EJBCA) and its memory,
# then runs ATF's timestamping setup against it and tries "monitor gone" by hand.
# The only secret is the read-only ilm-private pull login, given to the step that pulls the images and to nothing else;
# up.sh deletes it from the cluster once the images are on the node. No logs of the private containers are printed.
on:
  push:
    branches: [spike/165-throwaway-ilm]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Runner
        run: |
          nproc; free -m; df -h / | tail -1
          kind version || true; kubectl version --client; helm version --short
      - name: Install kind when the image has none
        run: command -v kind || { curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 && sudo install kind /usr/local/bin/kind; }
      - name: Bring the throw-away ILM up
        env:
          ILM_PRIVATE_PULL_USERNAME: ${{ secrets.ILM_PRIVATE_PULL_USERNAME }}
          ILM_PRIVATE_PULL_PASSWORD: ${{ secrets.ILM_PRIVATE_PULL_PASSWORD }}
        run: OUT=/tmp/atf165 CLUSTER=atf165 bash spike/165/env/up.sh
      - name: Memory after 5 minutes of idle
        if: always()
        run: |
          sleep 300
          free -m
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}' atf165-control-plane
          docker exec atf165-control-plane crictl stats -o json | python3 -c '
          import sys, json
          rows = []
          for s in json.load(sys.stdin)["stats"]:
              m = s.get("memory", {}).get("workingSetBytes", {}).get("value")
              if m is None: continue
              l = s["attributes"]["labels"]; rows.append((int(m), l["io.kubernetes.pod.namespace"] + "/" + l["io.kubernetes.container.name"]))
          rows.sort(reverse=True); print("sum GiB %.2f" % (sum(r[0] for r in rows) / 2**30))
          for m, n in rows[:15]: print("%6.0f MiB %s" % (m / 2**20, n))'
      - name: Edge checks (client certificates, forged headers, EST route, kind network)
        run: CLUSTER=atf165 bash spike/165/env/edge/edge-check.sh /tmp/atf165
      - name: ATF logs in and runs the timestamping block's setup
        run: |
          echo "127.0.0.1 ilm.kind.local" | sudo tee -a /etc/hosts
          bash spike/165/env/atf-env.sh /tmp/atf165
          cd czertainly-e2e && npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          REG_ENV_FILE=/tmp/atf165/atf.env DEV_BLOCK=timestamping npx playwright test -c playwright.devblock.config.ts --project timestamping-setup --reporter=line
      - name: Monitor gone by hand (timeQualityMonitor.enabled false, then true) - Core downtime through the edge
        if: always()
        run: |
          export KUBECONFIG=/tmp/atf165/kubeconfig
          kubectl -n ilm get deploy -o name
          probe() { while :; do echo "$(date +%s) $(curl -s -o /dev/null -w '%{http_code}' --max-time 3 --cacert /tmp/atf165/edge-ca.pem \
            --resolve ilm.kind.local:30443:127.0.0.1 https://ilm.kind.local:30443/api/v1/info)"; sleep 1; done; }
          containers() { kubectl -n ilm get pod -l app.kubernetes.io/name=core -o jsonpath='{range .items[*]}{.metadata.name}: {range .status.containerStatuses[*]}{.name}={.ready} {end}{"\n"}{end}'; }
          for state in false true; do
            probe > /tmp/probe-$state.log & P=$!
            t=$(date +%s); kubectl -n ilm patch platform ilm --type merge -p "{\"spec\":{\"core\":{\"timeQualityMonitor\":{\"enabled\":$state}}}}"
            sleep 10; kubectl -n ilm rollout status deploy/core --timeout=10m || true
            for i in $(seq 1 60); do grep -q ' 200$' <(tail -1 /tmp/probe-$state.log) && break; sleep 2; done
            sleep 5; kill $P
            echo "enabled=$state: rollout + API back after $(( $(date +%s)-t ))s; seconds without 200: $(grep -vc ' 200$' /tmp/probe-$state.log)"
            containers
          done
      - name: Connector off and on
        run: |
          export KUBECONFIG=/tmp/atf165/kubeconfig
          t=$(date +%s); kubectl -n ilm patch connectors.otilm.com software-cryptography-provider --type merge -p '{"spec":{"replicas":0}}'
          kubectl -n ilm wait --for=delete pod -l app.kubernetes.io/name=software-cryptography-provider --timeout=120s; echo "off: $(( $(date +%s)-t ))s"
          t=$(date +%s); kubectl -n ilm patch connectors.otilm.com software-cryptography-provider --type merge -p '{"spec":{"replicas":1}}'
          kubectl -n ilm rollout status deploy/software-cryptography-provider --timeout=5m; echo "on: $(( $(date +%s)-t ))s"
      - name: Timings
        if: always()
        run: cat /tmp/atf165/times.log || true
