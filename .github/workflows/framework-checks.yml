# Fast checks on the framework's own code. No environment, no secrets: these must stay quick and
# green so that a red run means something, which is why the smoke suite - which needs a live
# platform and credentials - is not run from here. Chromium is installed only for page-object
# stand-in unit tests that use Playwright's `page` fixture; nothing talks to a real browser UI.
name: Framework checks

on:
  pull_request:
    paths:
      - 'czertainly-e2e/**'
      - '.github/workflows/framework-checks.yml'
  push:
    branches: [main]
    paths:
      - 'czertainly-e2e/**'
      - '.github/workflows/framework-checks.yml'

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: framework-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests and spec parsing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: czertainly-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: czertainly-e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Page-object stand-in unit tests launch Chromium via the `page` fixture. Without this step
      # those tests fail with "Executable doesn't exist" and the --list steps below never run.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npx tsc --noEmit

      # Includes tests/unit/specGuards.spec.ts: the static rules over the REG-* / API-* specs and the
      # regression helpers (the deny-by-default guard lint) and the resolved project filters of both
      # configs (no @local test is selected unless TIER_KIND=local).
      - name: Unit tests
        run: npm run test:unit

      # The unit tests must write nothing into the tracked tree (a snapshot, a fixture, a generated file).
      - name: Unit tests left the tree unchanged
        run: git diff --exit-code

      # Every spec is imported and listed. This is what catches a broken import or a syntax error
      # in a suite that cannot otherwise be exercised here, because running it needs a platform.
      # Listing loads the configs but never runs their globalTeardown, so nothing reaches a tier.
      - name: All specs parse (smoke)
        run: npx playwright test --list

      - name: All specs parse (REG-* regression)
        run: npx playwright test -c playwright.regression.config.ts --list

      - name: All specs parse (API-*)
        run: npx playwright test -c playwright.api.config.ts --list

      - name: All specs parse (unit)
        run: npx playwright test -c playwright.unit.config.ts --list

      - name: All specs parse (visual)
        run: npx playwright test -c playwright.visual.config.ts --list
