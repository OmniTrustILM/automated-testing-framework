# Fast checks of the framework's own code: no environment, no secrets, so no smoke run here.
name: Framework checks

on:
  pull_request:
    paths:
      - 'czertainly-e2e/**'
      - '.github/workflows/framework-checks.yml'
  push:
    branches: [main]
    paths:
      - 'czertainly-e2e/**'
      - '.github/workflows/framework-checks.yml'

permissions:
  contents: read

concurrency:
  group: framework-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests and spec parsing
    # Pinned: Playwright 1.58 cannot install Chromium on ubuntu-latest (26.04). Back to ubuntu-latest with #140.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: czertainly-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: czertainly-e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      # For the page-object stand-in unit tests.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Unit tests left the tree unchanged
        run: git diff --exit-code

      # Listing imports every spec (a broken import fails here) and never reaches a tier.
      - name: All specs parse (smoke)
        run: npx playwright test --list

      - name: All specs parse (REG-* regression)
        run: npx playwright test -c playwright.regression.config.ts --list

      - name: All specs parse (API-*)
        run: npx playwright test -c playwright.api.config.ts --list

      - name: All specs parse (unit)
        run: npx playwright test -c playwright.unit.config.ts --list

      - name: All specs parse (visual)
        run: npx playwright test -c playwright.visual.config.ts --list

      # key-onboarding is @local only, so the list is empty here; it must still parse. Timestamping is not listed while it stays
      # disabled on develop-01.
      - name: All specs parse (key-onboarding block)
        run: DEV_BLOCK=key-onboarding npx playwright test -c playwright.devblock.config.ts --list --pass-with-no-tests
