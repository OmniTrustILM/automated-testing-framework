# The edge (Traefik, NodePort 30443) is published on the host's loopback, so requests reach it from the docker
# network's gateway address, never from 127.0.0.1 inside the pod (kubectl port-forward), which Core would treat as
# its localhost system user.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30443, hostPort: 30443, listenAddress: "127.0.0.1", protocol: TCP }
    # up.sh deletes the private-image pull secret (regcred) once the images are on the node. Since Kubernetes 1.35 the
    # kubelet re-checks the pull secret before a new pod may use an image that was pulled with one
    # (KubeletEnsureSecretPulledImages, default policy NeverVerifyPreloadedImages), so a recreated Core pod would try
    # to pull the monitor again and fail. This throw-away node trusts its own image cache instead.
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        imagePullCredentialsVerificationPolicy: NeverVerify
