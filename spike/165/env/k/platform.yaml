# Throw-away ILM for ATF#165: the shared environment's Platform (version develop, digests from image-refs.yaml)
# with the operator e2e `full` block's managed database, sized for one kind node.
apiVersion: otilm.com/v1alpha1
kind: Platform
metadata:
  name: ilm
  namespace: ilm
spec:
  version: develop
  common:
    hostName: ilm.kind.local
    trustedCertificates:
      secretRef: ilm-trusted-ca
  networkPolicy:
    ingressNamespace: kube-system # Traefik runs in kube-system, as on the shared environment
  database:
    mode: managed
    managed:
      instances: 1
      version: "16"
      storage:
        size: 2Gi
  messaging:
    mode: managed
    brokerType: rabbitmq
    managed:
      replicas: 1
      version: "4.3.1"
      storage:
        size: 1Gi
    timeQuality:
      enabled: true
  keycloak:
    mode: managed
    realm: ilm
    managed:
      instances: 1
  registerAdmin:
    enabled: true
    username: admin
    name: Platform
    lastName: Administrator
    email: admin@ilm.kind.local
    password:
      enabled: true
      secretRef: ilm-admin-password
    certificate: # from the edge CA (edge/edge-tls.yaml), which ilm-trusted-ca and the edge trust
      enabled: true
      source: generated
      issuerRef:
        name: edge-ca
        kind: Issuer
  core:
    clientCertHeader: X-Forwarded-Tls-Client-Cert
    timeQualityMonitor: # private image (ilm-private), pulled with regcred; up.sh deletes regcred once the images are on the node
      enabled: true
      image:
        pullSecrets:
          - regcred
  # The edge is Traefik in front (edge/), as on the shared environment; the operator's own edge stays off.
  edge:
    enabled: false
  gateway: # Kong must trust Traefik's X-Forwarded-* headers
    trustedIps:
      - "0.0.0.0/0"
      - "::/0"
